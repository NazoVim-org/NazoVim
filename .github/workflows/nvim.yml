name: Neovim Startup Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  nvim-startup:
    name: Check nvim starts without errors
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v15

      # nazoplug プラグインのキャッシュ
      - name: Cache nazoplug plugins
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/nvim-nazozokc/site/pack/nazoplug
            ~/.local/share/nvim-nazozokc/lazy
          key: nazoplug-${{ runner.os }}-${{ hashFiles('apps/nvim/nazoplug-lock.json') }}
          restore-keys: |
            nazoplug-${{ runner.os }}-
            lazy-${{ runner.os }}-

      - name: Set up Neovim config
        run: |
          export NVIM_APPNAME="nvim-nazozokc"
          CONFIG_DIR="$HOME/.config/$NVIM_APPNAME"
          mkdir -p "$CONFIG_DIR/lua"
          cp -r apps/nvim/. "$CONFIG_DIR/"
          cp -r template "$CONFIG_DIR/template"
          cp -r apps/nazoplug/lua/nazoplug "$CONFIG_DIR/lua/"
          chmod -R u+w "$CONFIG_DIR"
          echo "NVIM_APPNAME=$NVIM_APPNAME" >> "$GITHUB_ENV"
          echo "CONFIG_DIR=$CONFIG_DIR" >> "$GITHUB_ENV"

      # swagger-preview.nvim の build (npm install -g) が Nix 環境で
      # EACCES を起こさないよう、npm global prefix を書き込み可能な場所に設定する
      - name: Set up writable npm global prefix
        run: |
          mkdir -p /tmp/npm-global
          npm config set prefix /tmp/npm-global
          echo "/tmp/npm-global/bin" >> "$GITHUB_PATH"

      - name: Install nazoplug plugins
        timeout-minutes: 30
        env:
          NPM_CONFIG_PREFIX: /tmp/npm-global
        run: |
          nix develop --command sh -c '
            export NVIM_APPNAME="nvim-nazozokc"
            export NPM_CONFIG_PREFIX=/tmp/npm-global
            nvim --headless "+NazoPlug sync" +q 2>&1 | tee /tmp/nazoplug-sync.log
            echo "--- nazoplug sync log ---"
            cat /tmp/nazoplug-sync.log
            nvim --headless "+lua if not require([[nazoplug.commands]]).dispatch({[[check]]}) then vim.cmd([[cquit 1]]) end" +q
          '

      - name: Test first-run quickstart
        run: nix develop --command nvim --headless -u NONE -l apps/nvim/tests/quickstart_test.lua

      - name: Test configurable startup timing
        run: nix develop --command nvim --headless -u apps/nazoplug/tests/minimal_init.lua -l apps/nazoplug/tests/startup_test.lua

      - name: Test built-in editor features
        run: |
          nix develop --command nvim --headless -u NONE -l apps/nvim/tests/features_test.lua
          nix develop --command nvim --headless -u NONE -l apps/nvim/tests/builtin_test.lua

      - name: Check Neovim startup (no errors)
        env:
          NPM_CONFIG_PREFIX: /tmp/npm-global
        run: |
          nix develop --command sh -c '
            export NVIM_APPNAME="nvim-nazozokc"
            export NPM_CONFIG_PREFIX=/tmp/npm-global

            # --startuptime でタイム計測しつつ headless 起動
            nvim --headless \
              --startuptime /tmp/startuptime.log \
              -c "lua vim.defer_fn(function() vim.cmd(\"qall!\") end, 500)" \
              2>/tmp/nvim-stderr.log || true

            echo "=== stderr ==="
            cat /tmp/nvim-stderr.log

            echo "=== startuptime (tail) ==="
            tail -5 /tmp/startuptime.log 2>/dev/null || echo "(no startuptime log)"

            # E で始まる Vim エラー、または "Error" を含む行を検出して fail
            if grep -qE "(^E[0-9]+:|Error detected|Error in lua)" /tmp/nvim-stderr.log 2>/dev/null; then
              echo ""
              echo "::error::Neovim startup errors detected!"
              grep -E "(^E[0-9]+:|Error detected|Error in lua)" /tmp/nvim-stderr.log
              exit 1
            fi

            echo ""
            echo "✓ Neovim started without errors."
          '

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nvim-startup-logs
          path: |
            /tmp/nvim-stderr.log
            /tmp/nazoplug-sync.log
            /tmp/startuptime.log
